services:
  mikroman:
    # The published multi-architecture image, not a local build. Compose is the
    # recommended way to run MikroMan, and the boards it targets are the weak
    # half of the MikroTik range - an RB4011 has 1 GB of RAM and a 32-bit ARM
    # core. Building here would mean `npm ci`, a Vite production build and four
    # C extension compilations on the router itself; publishing amd64/arm64/
    # armv7 images from CI exists precisely so that never happens.
    #
    # To build from source instead (contributors, or an unreleased change), run
    # `docker build -t mikroman:dev .` and point this at `mikroman:dev`.
    image: ghcr.io/masseselsev/mikroman:latest
    container_name: mikroman
    restart: unless-stopped
    ports:
      - "1928:1928"
    environment:
      # The only setting the container needs. Everything else - the router, the
      # Telegram bot, polling intervals - is configured in the UI and stored in
      # this database. No .env file is read; see README.
      - DATABASE_URL=sqlite+aiosqlite:////data/app.db
    volumes:
      # Named volume, so the database survives `docker compose down` and image
      # rebuilds. Source directories are deliberately NOT mounted here: bind
      # mounting ./frontend/dist over the image shadowed the compiled bundle
      # with an empty directory on any machine that had not built it by hand.
      # For live-reloading development, see docker-compose.override.yml.example.
      - mikroman_data:/data

volumes:
  mikroman_data:
    driver: local
