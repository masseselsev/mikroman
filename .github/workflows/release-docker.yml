# ==============================================================================
# GitHub Actions Workflow: Automated Multi-Architecture Docker Container Release
#
# Builds and publishes production container images to GitHub Container Registry
# (ghcr.io) on GitHub Releases. Supports multi-arch targets (amd64, arm64, arm/v7)
# covering standard servers, x86/CHR, and modern/legacy MikroTik RouterOS devices.
# ==============================================================================

name: Release Docker Container

'on':
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Pre-flight Code Quality & Build Validation Gate
  # Enforces that all backend tests, linters, and frontend bundle compilations
  # succeed cleanly before any container image build or publication proceeds.
  # ============================================================================
  validate:
    name: Validate Code & Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend-go/go.sum

      - name: Run Go backend tests
        run: |
          cd backend-go
          go test -v ./internal/...

      - name: Set up Node.js 22 runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests (vitest)
        run: |
          cd frontend
          npm test -- --run

      - name: Verify frontend production bundle compilation
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # Stage 2: Multi-Architecture Build & GHCR Publishing
  # Executes cross-platform container builds (amd64, arm64, arm/v7) with BuildKit
  # caching and pushes tagged artifacts to ghcr.io using GITHUB_TOKEN.
  # ============================================================================
  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7

      # Set up QEMU user-space emulation for arm64 and arm/v7 cross-compilation
      - name: Set up QEMU emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      # Set up Buildx for advanced multi-platform and caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate directly to GitHub Container Registry using the automatic job token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata, generate standard OCI tags and labels
      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,format=short

      # Build multi-arch container images and push directly to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
